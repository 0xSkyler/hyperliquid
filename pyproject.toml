[project]
name = "hyperliquid-autonomous-trader"
version = "0.1.0"
description = "Expected-utility trading engine for Hyperliquid perpetuals (paper mode by default)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0", "aiohttp>=3.10", "lightgbm>=4.5", "anthropic>=1.0",
    "hyperliquid-python-sdk>=0.20", "eth-account>=0.13",  # order signing: live trading is the product
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Needed only for TESTNET / LIVE order placement.
live = []  # kept so older install commands still work; the libraries are core dependencies now
postgres = ["asyncpg>=0.30"]
# Only for python -m app.research.ticks (fast CSV parsing of tick archives).
research = ["polars>=1.0"]
fast = ["uvloop>=0.20; sys_platform != 'win32'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "backtest*"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/monitoring/dashboard.py" = ["E501"]
"tests/*.py" = ["S105", "S106", "E501"]
"scripts/*.py" = ["E501"]
"app/research/*.py" = ["E501"]
