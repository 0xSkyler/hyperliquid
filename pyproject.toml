[project]
name = "hyperliquid-autonomous-trader"
version = "0.1.0"
description = "Expected-utility trading engine for Hyperliquid perpetuals (paper mode by default)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "aiohttp>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Needed only for TESTNET / LIVE order placement.
live = ["hyperliquid-python-sdk>=0.9", "eth-account>=0.13"]
postgres = ["asyncpg>=0.30"]
fast = ["uvloop>=0.20; sys_platform != 'win32'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "backtest*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/monitoring/dashboard.py" = ["E501"]
